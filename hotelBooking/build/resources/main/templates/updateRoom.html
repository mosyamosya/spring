  <form th:action="@{/views/rooms/{id}/update(id=${room.id})}" th:object="${room}" method="post">
    <div class="row mb-3">
      <label for="bed" class="form-label">Change number of Beds:</label>
      <input type="text" id="bed" name="bed" th:field="*{bed}"  class="form-control" aria-describedby="emailHelp">
      <div id="emailHelp" class="form-text">Number of beds must be at least 1.</div>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Name:</label>
      <input type="text" id="name" name="name" th:field="*{name}" class="form-control">
      <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></span>

    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
  <br>
  <a href="/views/rooms">Back to Rooms List</a>
</body>
</body>

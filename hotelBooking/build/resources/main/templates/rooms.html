<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deluxe rest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body class="">
  <h1>Available Rooms</h1>
  <table class="table table-bordered border-primary" border="1">
    <thead class="bg-primary">
      <tr>
        <th>Number of beds</th>
        <th>Name of room</th>
        <th>What do you want?</th>
        <th>Owner</th>
        <th>Start date</th>
        <th>End date</th>
        <th>Create new room</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="room : ${rooms}">
        <td th:text="${room.bed}"></td>
        <td th:text="${room.name}"></td>
        <td>
          <form th:if="${room.booking == null or room.booking.user == null}"
            th:action="@{/views/rooms/{id}/bookRoom(id=${room.id})}" method="post">
            <input type="hidden" name="_method" value="put" />
            <button type="submit" class="btn btn-outline-secondary">Book room</button>
          </form>


          <form th:if="${room.booking != null and room.booking.user != null}"
            th:action="@{/views/rooms/{id}/unbookRoom(id=${room.id})}" method="post">
            <input type="hidden" name="_method" value="put" />
            <button type="submit" class="btn btn-outline-secondary">Unbook room</button>
          </form>

          <form th:action="@{/views/rooms/{id}(id=${room.id})}" method="post">
            <input type="hidden" name="_method" value="delete" />
            <button type="submit" class="btn btn-outline-secondary">Delete room</button>
          </form>

          <form th:action="@{/views/rooms/{id}/update(id=${room.id})}" method="get">
            <button type="submit" class="btn btn-outline-secondary">Update room</button>
          </form>
        </td>
        <td th:text="${room.booking != null && room.booking.user != null ? room.booking.user.username : 'Empty'}">
        </td>
        <td th:text="${room.booking != null ? room.booking.bookedAt : 'FREE'}"></td>
        <td th:text="${room.booking != null ? room.booking.expiredAt : 'FREE'}"></td>
        
      </tr>
    </tbody>
          <button onclick="location.href='/views/rooms/create'" class="btn btn-outline-success">Create room</button>
      
  </table>


</body>

</html>
